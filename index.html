<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEON — God of Pangaea</title>
  <style>
    :root {
      --gold: #e8c87a;
      --gold-dim: #b89a52;
      --ink: #0c0e14;
      --panel: rgba(16, 19, 28, 0.82);
      --panel-edge: rgba(232, 200, 122, 0.22);
      --text: #d8dae2;
      --text-dim: #8b8f9c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }
    body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; color: var(--text); }
    canvas { display: block; }

    /* ---- Loading / title veil ---- */
    #veil {
      position: fixed; inset: 0; z-index: 200;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(40,34,20,0.55), transparent 60%),
        linear-gradient(180deg, #06070b 0%, #0c0e14 60%, #06070b 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: opacity 0.8s ease;
    }
    #veil.hidden { opacity: 0; pointer-events: none; }
    #veil .mark {
      font-size: clamp(38px, 8vw, 92px); letter-spacing: 0.34em;
      font-weight: 700; color: var(--gold);
      text-shadow: 0 0 38px rgba(232,200,122,0.35); padding-left: 0.34em;
    }
    #veil .sub {
      margin-top: 0.6em; font-size: clamp(11px, 1.6vw, 16px);
      letter-spacing: 0.5em; color: var(--gold-dim); padding-left: 0.5em;
    }
    #veil .status { margin-top: 2.4em; font-size: 13px; letter-spacing: 0.2em; color: var(--text-dim); }
    #veil .enter {
      margin-top: 1.6em; font-size: 14px; letter-spacing: 0.3em; color: var(--text);
      border: 1px solid var(--panel-edge); padding: 14px 34px; border-radius: 3px;
      cursor: pointer; opacity: 0; transition: opacity 0.4s, background 0.2s, color 0.2s;
      background: rgba(232,200,122,0.04);
    }
    #veil .enter.ready { opacity: 1; }
    #veil .enter:hover { background: rgba(232,200,122,0.14); color: var(--gold); }
    @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    #veil .status.loading { animation: pulse 1.4s ease-in-out infinite; }

    #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
    .panel {
      background: var(--panel); border: 1px solid var(--panel-edge);
      border-radius: 6px; backdrop-filter: blur(7px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    }
    .pointer { pointer-events: auto; }
    ::selection { background: rgba(232,200,122,0.3); }
  </style>
</head>
<body>
  <div id="veil">
    <div class="mark">AEON</div>
    <div class="sub">GOD OF PANGAEA</div>
    <div class="status loading" id="veil-status">SHAPING THE WORLD…</div>
    <div class="enter" id="veil-enter">ENTER THE WORLD</div>
  </div>

  <div id="ui-root"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
